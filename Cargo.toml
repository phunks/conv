[package]
name = "conv"
version = "0.2.4"
edition = "2024"
license = "MIT"
description = "converter tool"
keywords = ["egui", "converter", "utility"]
readme = "README.md"
homepage = "https://github.com/phunks/conv"
repository = "https://github.com/phunks/conv"

[profile.release]
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1


[dependencies]
env_logger = "0.11"
eframe = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
itertools = "0.14"
regex = { version = "1.11" }
fancy-regex = { version = "0.14.0" }
base64 = "0.22.1"
url-escape = "0.1.1"
rustc-serialize = "0.3.25"
html-escape = "0.2.13"
utf7-imap = "0.3.2"
flate2 = "1.1"
inflate = "0.4.5"
sha2 = { version = "0.10", default-features = false }
digest = { version = "0.10.7", features = ["alloc"] }
md5 = "0.7.0"
sha1 = "0.11.0-pre.4"
aead = { version = "0.6.0-rc.0", default-features = false }
aes = { version = "0.9.0-pre.2", optional = true }
cipher = { version = "0.5.0-pre.7" , features = ["alloc", "block-padding"]}
aes-gcm = "0.11.0-pre.2"
hybrid-array = "0.2"
crypto2 = { git = "https://github.com/shadowsocks/crypto2", version = "0.2.0" }
better_default = "1.0"

jaq-core = { version = "2.1" }
jaq-std  = { version = "2.1" }
jaq-json = { version = "1.1" }
aho-corasick = "1.1.3"
log = "0.4.22"
codesnake = "0.2.1"
hifijson = "0.2.2"
unicode-width = "0.2"
