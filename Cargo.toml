[package]
name = "conv"
version = "0.4.1"
edition = "2024"
license = "MIT"
description = "converter tool"
keywords = ["egui", "converter", "utility"]
readme = "README.md"
homepage = "https://github.com/phunks/conv"
repository = "https://github.com/phunks/conv"

#[profile.release]
#debug = true
#strip = "none"
#lto = "thin"
#codegen-units = 1
#split-debuginfo = "unpacked"

[profile.release]
strip = "symbols"

[dependencies]
env_logger = "0.11"
#eframe = { version = "0.31.1" }
eframe = { version = "0.31.1", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui_extras = { version = "0.31.1", features = ["all_loaders"] }
difftastic = { path = "ext/difftastic" }
strum = { version = "0.28", features = ["derive"] }
regex = { version = "1.13" }
fancy-regex = { version = "0.19.0" }
base64 = "0.23"
url-escape = "0.1"
html-escape = "0.2"
utf7-imap = "0.3"
flate2 = "1.1"
inflate = "0.4.5"
sha2 = { version = "0.11", default-features = false }
digest = { version = "0.11", features = ["alloc"] }
md5 = "0.8"
sha1 = "0.11"
base16ct = { version = "1.0", features = ["alloc"] }
aead = { version = "0.6", default-features = false }
aes-gcm = "0.11"
jaq-core = { version = "3.1" }
jaq-std  = { version = "3.0" }
jaq-json = { version = "2.0" , features = ["serde"] }
jaq-fmts = { version = "0.1" }
codesnake = "=0.2.1"
unicode-width = "0.2"
bytes = "1.12.1"
taplo = "0.14"
serde_json = "1"
serde-saphyr = "1.0"
log = "0.4.33"
quick-xml = "0.41"
sqlformat = "0.5"
dprint-plugin-typescript = "0.96"
dprint-plugin-json = "0.23"
markup_fmt = "0.27"
malva = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = [
    "wayland",
    "x11",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[patch.crates-io]
## see #7379, #1272
eframe = { path = "ext/egui/crates/eframe" }
epaint = { path = "ext/egui/crates/epaint" }
egui_extras = { path = "ext/egui/crates/egui_extras" }